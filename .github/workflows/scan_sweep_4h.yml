name: Sweep Scanner 4h

on:
  workflow_dispatch:
  schedule:
    # De 4 em 4 horas, 10 min apos o fecho da vela UTC.
    - cron: "10 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  # Grupo POR TIMEFRAME, nao partilhado com os outros scanners.
  #
  # Antes todos usavam "trading-scanners" para evitar conflitos de push.
  # Isso deixou de servir: o de 1h corre 24x/dia e ficaria a bloquear os
  # outros. Como cada workflow escreve o SEU ficheiro de estado, o rebase
  # resolve sozinho -- o grupo so precisa de impedir que a mesma workflow
  # se sobreponha a si propria.
  group: sweep-4h
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sweep scanner (4h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python main_sweep.py --config config_sweep_4h.yaml

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sweep_4h_signals.json state/sweep_4h_heartbeat.json || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: sweep 4h state [skip ci]"
          # Varios workflows escrevem no repositorio; o retry com rebase e
          # o que evita que um push perdido derrube a execucao.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep $((attempt * 5))
          done
          exit 1
