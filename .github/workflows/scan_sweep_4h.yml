name: Sweep Scanner 4h

on:
  workflow_dispatch:
  schedule:
    # 10 min antes de cada fecho de vela de 4h (UTC). Ver nota no workflow
    # de 1h sobre porque se arranca cedo e se espera.
    - cron: "50 3,7,11,15,19,23 * * *"

permissions:
  contents: write

concurrency:
  group: sweep-4h
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alinhar ao fecho da vela
        run: python wait_until.py --minute 2 --max-wait 900 --grace 600

      - name: Run sweep scanner (4h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python main_sweep.py --config config_sweep_4h.yaml

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sweep_4h_signals.json state/sweep_4h_heartbeat.json || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: sweep 4h state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep $((attempt * 5))
          done
          exit 1
