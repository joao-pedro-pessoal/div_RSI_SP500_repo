name: Sweep Scanner 1h

on:
  workflow_dispatch:
  schedule:
    # 10 minutos ANTES da hora, de proposito.
    #
    # Os agendamentos do GitHub nao sao pontuais: um cron para os :05 pode
    # disparar aos :17. Arrancando as :50 o job entra na fila mais cedo e o
    # passo seguinte alinha-o ao minuto certo.
    #
    # Se o proprio gatilho atrasar muito, o wait_until.py deteta e corre ja
    # -- nunca fica a espera de uma hora inteira.
    - cron: "50 * * * *"

permissions:
  contents: write

concurrency:
  group: sweep-1h
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 25 min de scan + ate 15 min de espera alinhada
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Alinha o arranque ao minuto :02. A vela de 1h fecha aos :00; dois
      # minutos dao a OKX tempo de a marcar como fechada (confirm=1).
      - name: Alinhar ao fecho da vela
        run: python wait_until.py --minute 2 --max-wait 900 --grace 600

      - name: Run sweep scanner (1h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python main_sweep.py --config config_sweep_1h.yaml

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sweep_1h_signals.json state/sweep_1h_heartbeat.json || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: sweep 1h state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep $((attempt * 5))
          done
          exit 1
