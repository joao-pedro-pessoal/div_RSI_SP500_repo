name: Crypto Divergence 4h

on:
  workflow_dispatch:
  schedule:
    # De 4 em 4 horas, 15 min apos o fecho da vela UTC.
    # Corta o atraso total de 44h para 24h (o resto e estrutural).
    - cron: "15 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-div-4h
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run divergence scanner (4h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_CRYPTO }}
        run: python main_crypto.py --config config_crypto_4h.yaml

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_CRYPTO }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/crypto_4h_signals.json state/crypto_4h_heartbeat.json universe/ || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: crypto divergence 4h state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep $((attempt * 5))
          done
          exit 1
