name: Crypto Divergence 4h

on:
  workflow_dispatch:
  schedule:
    # TRES gatilhos, nao um.
    #
    # Medido no proprio repositorio: o Sweep Scanner 1h ia na execucao #202
    # quando deviam ser ~360 -- o GitHub descarta cerca de 44% das execucoes
    # agendadas em periodos de carga. Com tres tentativas a probabilidade de
    # pelo menos uma correr sobe de 56% para ~91%.
    #
    # As tentativas extra nao duplicam trabalho: o --skip-if-recent faz a
    # segunda sair de imediato se a primeira ja correu.
    - cron: "46 3,7,11,15,19,23 * * *"
    - cron: "52 3,7,11,15,19,23 * * *"
    - cron: "58 3,7,11,15,19,23 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-div-4h
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 45 min: um envio bloqueado por 429 nao pode ser morto a meio, ou
    # perdem-se alertas. Com o envio agrupado isto sobra, mas a margem
    # custa zero num repositorio publico.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Alinha ao minuto :02. A vela fecha aos :00; dois minutos dao a OKX
      # tempo de a marcar como fechada (confirm=1).
      #
      # E este passo que torna a janela de 1 barra utilizavel: sem ele, uma
      # execucao as :50 reportaria a vela que fechou ha 50 minutos.
      - name: Alinhar ao fecho da vela
        run: python wait_until.py --minute 2 --max-wait 900 --grace 600

      - name: Run divergence scanner (4h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_CRYPTO }}
        run: python main_crypto.py --config config_crypto_4h.yaml --skip-if-recent 120

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_CRYPTO }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/crypto_4h_signals.json state/crypto_4h_heartbeat.json universe/ || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: crypto div 4h state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep $((attempt * 5))
          done
          exit 1
