name: Diagnostico de rede

# Nao tem schedule: corre-se a mao quando algo bloqueia.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar cada origem de dados
        run: python check_apis_ci.py
