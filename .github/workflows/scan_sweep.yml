name: Liquidity Sweep Scanner

on:
  workflow_dispatch:
  schedule:
    # 00:40 UTC — 20 min depois do bot de divergencias, para nao competirem
    # pelo mesmo grupo de concorrencia mais do que o necessario.
    - cron: "40 0 * * *"

permissions:
  contents: write

concurrency:
  # Mesmo grupo dos outros dois workflows: todos escrevem estado neste
  # repositorio, e correr em simultaneo provoca push rejeitado.
  group: trading-scanners
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sweep scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python main_sweep.py

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist sweep state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sweep_signals.json state/sweep_heartbeat.json || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: update sweep scanner state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep 5
          done
          exit 1
