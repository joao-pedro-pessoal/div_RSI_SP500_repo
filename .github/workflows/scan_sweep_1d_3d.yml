name: Sweep Scanner Daily

on:
  workflow_dispatch:
  schedule:
    # 10 minutos ANTES do fecho da vela, de proposito.
    #
    # Os agendamentos do GitHub nao sao pontuais: um cron para os :05 pode
    # disparar aos :17. Arrancando cedo o job entra na fila antes, e o passo
    # de alinhamento espera pelo minuto certo -- com guardas para nunca
    # esperar mais do que valeria a pena.
    - cron: "50 23 * * *"

permissions:
  contents: write

concurrency:
  group: sweep-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 45 min: um envio bloqueado por 429 nao pode ser morto a meio, ou
    # perdem-se alertas. Com o envio agrupado isto sobra, mas a margem
    # custa zero num repositorio publico.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Alinha ao minuto :02. A vela fecha aos :00; dois minutos dao a OKX
      # tempo de a marcar como fechada (confirm=1).
      #
      # E este passo que torna a janela de 1 barra utilizavel: sem ele, uma
      # execucao as :50 reportaria a vela que fechou ha 50 minutos.
      - name: Alinhar ao fecho da vela
        run: python wait_until.py --minute 2 --max-wait 900 --grace 600

      - name: Run sweep scanner (1D/3D)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python main_sweep.py --config config_sweep_daily.yaml

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID_SWEEP }}
        run: python -m crypto_scanner.notify_failure

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sweep_daily_signals.json state/sweep_daily_heartbeat.json universe/ || true
          if git diff --cached --quiet; then
            echo "nada para guardar"
            exit 0
          fi
          git commit -m "chore: sweep daily state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push falhou (tentativa $attempt)"
            sleep $((attempt * 5))
          done
          exit 1
