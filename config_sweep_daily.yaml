# Varrimentos de liquidez ("stop hunts").
#
# CALIBRADO COM CASOS REAIS marcados no TradingView, nao com dados
# sinteticos. A calibracao anterior usava velas inventadas com 93% de pavio
# e produzia min_wick_fraction=0.65, que rejeitava TODOS os casos reais
# (que medem 0.55 a 0.74).
#
# O ALVO DO VARRIMENTO E O ULTIMO PIVOT, nao a origem da tendencia.
# Medido: a origem fica alcancavel em estruturas curtas (0.2 ATR) e
# impossivel em tendencias longas (4.5 ATR). Continua reportada em
# origin_atr, mas nao bloqueia.
#
# VOLUME ESPERADO: ~49 alertas/dia com 100 moedas em ruido puro.
# Se for demais, sobe min_wick_fraction -- e o parametro mais eficaz:
#   0.45 -> 49/dia   (atual)
#   0.50 -> 39/dia
#   0.55 -> 26/dia
#   0.60 -> 17/dia

scanner:
  atr_period: 14
  min_trend_atr: 0.12
  min_depth_atr: 0.1
  min_wick_ratio: 0.8
  timeframes: [1D, 3D]

  # --- definicao da tendencia ---
  # Pivots, nao linhas desenhadas: uma linha depende de onde a ancoras, e
  # mover o ponto inicial duas velas faz o padrao aparecer ou desaparecer.
  pivot_left: 2
  pivot_right: 2
  min_pivots: 2
  max_trend_bars: 120

  # --- o varrimento ---
  # Fracao da amplitude da tendencia. 0.15 = o pavio pode parar 15% acima
  # da origem e ainda contar. Baixar exige tocar a origem com precisao.
  max_bars_after_pivot: 20

  # --- a recuperacao: O PAVIO E O CRITERIO CENTRAL ---
  #
  # min_wick_fraction = pavio a dividir pela AMPLITUDE TOTAL da vela (0..1).
  #
  # Nao se usa pavio/corpo: esse racio e instavel -- com corpo perto de zero
  # dispara para infinito, e uma vela minuscula podia dar racio enorme sem
  # ter forma nenhuma. A fracao diz exatamente o que interessa.
  #
  # Medido (deteccao em cenarios conhecidos vs ruido puro):
  #
  #   limiar   detecao   ruido/1000 barras
  #    0.50      9/10          0.43
  #    0.65      9/10          0.11   <- escolhido
  #    0.70      9/10          0.09
  #    0.80      9/10          0.00
  #
  # Apertar de 0.50 para 0.70 nao perde detecao e corta o ruido 4x. 0.65
  # fica perto desse ganho com margem para velas reais, que nao sao tao
  # limpas como as sinteticas.
  #   sobe para 0.75 se os alertas ainda parecerem fracos
  #   baixa para 0.55 se estiver a perder casos bons
  min_wick_fraction: 0.45

  # Secundario: a fracao ja faz o trabalho principal, isto e rede.
  min_close_position: 0.45

  # Janela de alerta EM BARRAS DE CADA TIMEFRAME.
  #
  # Agora que cada timeframe tem o seu proprio workflow com a frequencia
  # certa, a janela so precisa de margem para uma execucao falhada -- nao
  # de cobrir 24h como antes. Menos janela = menos hipotese de repetidos.
  alert_age_bars:
    1D: 2
    3D: 2

universe:
  limit: 100
  exclude_stablecoins: true
  exclude_wrapped: true

data:
  # O varrimento so precisa de max_trend_bars + margem, nao dos 4200 do
  # bot de divergencias. 3000 barras 4h dao ~166 barras de 3D, suficiente.
  bars_4h: 3000
  bars_1h: 100
  sleep_between: 0.12

telegram:
  # corre 1x/dia
  send_start_notice: true
  send_heartbeat: true

state_file: state/sweep_daily_signals.json
heartbeat_file: state/sweep_daily_heartbeat.json
